[package]
name = "mdma"
version = "0.6.0"
edition = "2024"
rust-version = "1.99"
description = "Model Dispatch and Memory Allocator"
default-run = "mdma"
license = "BSD-2-Clause"
repository = "https://github.com/seuros/mdma"
keywords = ["llm", "inference", "gguf", "gpu", "mtls"]
categories = ["science", "hardware-support", "command-line-utilities", "network-programming"]
exclude = [
    "/.tmp/",
    "/.gitignore",
    "/mise.toml",
    "/Justfile",
    "/doc/",
    "/deploy/",
    "/tools/",
    "/tests/",
    "**/tests.rs",
    "/src/**/tests/",
    "/src/**/*_tests.rs",
    "/src/**/test_support.rs",
    "/src/**/test_support/",
    "/data/fixtures/",
    # The bun project that builds src/bin/mdma-web/assets/scene.js.
    "/web/",
    # Test-only module shell (`#[cfg(test)] mod attention;`).
    "/src/backend/rocm/attention.rs",
]

[workspace]

[dependencies]
aws-lc-rs = "1.18.1"
base64 = "0.23.1"
bytemuck = "1.25.2"
candle-core = "0.11.0"
half = "2.7.1"
hex = "0.4.3"
mdns-sd = { version = "0.21.5", optional = true }
rama = { version = "0.4.0", features = ["grpc", "rustls", "aws-lc", "tcp", "http-full"], optional = true }
rand = "0.10.3"
rayon = "1.12.0"
rcgen = { version = "0.14.10", default-features = false, features = ["pem", "x509-parser", "aws_lc_rs"], optional = true }
rocm-rs = { version = "0.5.2", default-features = false, features = ["macros"], optional = true }
ash = { version = "0.38.0", optional = true }
rustls-pki-types = { version = "1.15.1", features = ["std"], optional = true }
safetensors = "0.8.0"
same-file = "1.0.6"
semver = "1.0.28"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.152", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.11.0"
state-machines = { version = "0.31.0", optional = true }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokenizers = { version = "1.0.0-rc.2", default-features = false, features = ["regex"] }
toml = "1.1.8"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "signal", "sync", "macros", "time"], optional = true }
tokio-stream = { version = "0.1.19", optional = true }
tokio-util = { version = "0.7.20", optional = true }
usage-rs = { version = "7.0.0", default-features = false, features = ["help", "diagnostics"], optional = true }
x509-parser = { version = "0.18.1", default-features = false, optional = true }

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2.190"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.190"
objc2 = { version = "0.6.5", optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSError", "NSObject", "NSString"], optional = true }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "std", "MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder",
    "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice",
    "MTLLibrary", "MTLResource", "MTLTypes",
], optional = true }

[target.'cfg(any(target_os = "freebsd", target_os = "linux"))'.dependencies]
libc = { version = "0.2.190", optional = true }

[build-dependencies]
rama = { version = "0.4.0", features = ["grpc"], optional = true }

[features]
default = ["cpu"]
cpu = []
cli = ["dep:usage-rs"]
service = [
    "dep:rama", "dep:rcgen", "dep:rustls-pki-types", "dep:x509-parser",
    "dep:state-machines", "dep:tokio", "dep:tokio-stream", "dep:tokio-util",
    "dep:mdns-sd",
]
rocm = ["dep:rocm-rs"]
vulkan = ["dep:ash"]
level0 = []
cuda = []
metal = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
coral = ["dep:libc"]

[[bin]]
name = "mdma"
path = "src/bin/mdma.rs"
required-features = ["cli", "service"]

[[bin]]
name = "mdma-serve"
path = "src/bin/mdma-serve.rs"
required-features = ["cli", "service"]

[[bin]]
name = "mdma-client"
path = "src/bin/mdma-client.rs"
required-features = ["cli", "service"]

[[bin]]
name = "mdma-certs"
path = "src/bin/mdma-certs.rs"
required-features = ["service"]

[[bin]]
name = "mdma-fed"
path = "src/bin/mdma-fed.rs"
required-features = ["cli", "service"]

[[bin]]
name = "mdma-web"
path = "src/bin/mdma-web.rs"
required-features = ["cli", "service"]

[[bin]]
name = "mdma-ha"
path = "src/bin/mdma-ha.rs"
required-features = ["cli"]

[[bin]]
name = "mdma-cache"
path = "src/bin/mdma-cache.rs"
required-features = ["cli"]

[[bin]]
name = "mdma-run"
path = "src/bin/mdma-run.rs"
required-features = ["cli"]

[[bin]]
name = "mdma-bench"
path = "src/bin/mdma-bench.rs"
required-features = ["cli"]

[[bin]]
name = "mdma-laya"
path = "src/bin/mdma-laya.rs"
required-features = ["cli"]

[[test]]
name = "hardware_cli"
required-features = ["cli", "service"]

[[test]]
name = "runtime_cli"
required-features = ["cli", "service"]

[[test]]
name = "checkpoint_cli"
required-features = ["cli", "service"]

[[test]]
name = "fed_cli"
required-features = ["cli", "service"]

[[test]]
name = "lazy_cli"
required-features = ["cli", "service"]

[[test]]
name = "web_cli"
required-features = ["cli", "service"]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
# dead_code_pub_in_binary is omitted: the lib test harness counts as an executable
# and would flag public library API used only by the binaries.

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# mul_add changes f32 rounding; kernels must match the CPU/llama.cpp references bit for bit.
suboptimal_flops = "allow"
# Exact float comparisons are deliberate parity checks.
float_cmp = "allow"
# Tensor geometry and dtype math is validated at load boundaries.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
# Math notation (q, k, v, d, m) mirrors the reference formulas.
many_single_char_names = "allow"
similar_names = "allow"
# Token IDs, hashes and format constants stay greppable against references.
unreadable_literal = "allow"
# Model and product names are prose, not code identifiers.
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_long_first_doc_paragraph = "allow"
too_many_lines = "allow"
# pub(crate) inside private modules documents the intended visibility.
redundant_pub_crate = "allow"
# Nursery lints with frequent false positives on lock guards and const eligibility.
significant_drop_tightening = "allow"
missing_const_for_fn = "allow"
# Async trait impls whose trait requires an async signature.
unused_async_trait_impl = "allow"
# Rewrites `assert!(v.is_empty())` into typed empty-array comparisons.
assert_is_empty = "allow"
# Child modules share their parent's items via `use super::*`.
wildcard_imports = "allow"
# Tokio task stacks absorb ~20 KiB request futures; boxing adds per-request allocations.
large_futures = "allow"
# Nursery lints that flag correct validity-window checks and idiomatic if-let chains.
suspicious_operation_groupings = "allow"
option_if_let_else = "allow"

# Debug info for every dependency is most of target/debug. Line tables keep
# file:line in backtraces for our own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = true
